services:
  app:
    build: .
    # The checkout is mounted over the image's /srv, so a fresh clone has no vendor/: install it on the first start.
    command: ["sh", "-c", "[ -f vendor/autoload_runtime.php ] || composer install --no-interaction --prefer-dist; exec frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile"]
    ports:
      - "8080:8080"
    env_file:
      - path: app/.env.local
        required: false
    environment:
      COMPOSER_CACHE_DIR: /composer-cache
    volumes:
      - ./:/srv
      - composer-cache:/composer-cache
    tmpfs:
      - /tmp   # uploads live in memory only

  ollama:
    image: ollama/ollama
    profiles: ["local"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
  composer-cache:
