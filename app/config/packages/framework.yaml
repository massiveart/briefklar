# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # The only outgoing HTTP calls are model requests (config/packages/ai.yaml). A local model
    # answers after 30-40 s without sending anything in between, so the idle timeout must cover
    # the whole generation. LetterController raises PHP's time limit to match.
    http_client:
        default_options:
            timeout: '%env(float:EXPLANATION_TIMEOUT)%'
            max_duration: '%env(float:EXPLANATION_TIMEOUT)%'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
