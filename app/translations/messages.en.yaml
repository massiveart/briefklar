app:
    name: Clarifile
    language_switch: Language
    nav:
        label: Page navigation
        how_it_works: How it works
        privacy: Privacy
    footer:
        made_for: Clarifile · Symfony AI & MCP Hackathon 2026 · Open source (MIT)
        not_legal_advice: An explanation, not legal advice.
letter:
    privacy: Your letter is processed for this request only and is not stored. Text recognition runs locally on this server.
    landing:
        hero:
            title_start: Official letters,
            title_end: clearly explained.
            lead: Upload your letter. We tell you what it says, what you have to do and by when, even if the letter is in German.
            privacy_promise: The language model that explains your letter never sees names, addresses or account numbers.
        how:
            title: Four steps to an explanation
            sub: Your letter is processed for this one request only. Everything that identifies you stays on the server.
            where_local: local
            where_model: language model
            read:
                title: Read
                text: Text recognition runs locally on the server. Your photo or scan never leaves it.
            redact:
                title: Redact
                text: Names, addresses, IBAN and file numbers are replaced with placeholders.
            explain:
                title: Explain
                text: The AI only sees the redacted text and writes the explanation.
            restore:
                title: Restore
                text: Your data is put back into the answer, for you only. Nothing is stored.
        privacy:
            title: What the AI gets to see
            sub: On the left an excerpt from an invented letter, on the right the text the language model actually receives.
            letter: Your letter
            stays: stays here
            model: Sent to the language model
            redacted: redacted
            note: Amount and deadline stay readable so the explanation is right.
        get:
            eyebrow: What you get
            title: Clarity instead of officialese
            facts:
                title: Deadline, amount, steps
                text: What the authority wants, what you have to do and by when, in plain words.
            checked:
                title: Checked deadlines
                text: Every deadline is compared with the original letter. Anything not in it is flagged.
            qr:
                title: Pay by QR code
                text: For payments, a code for your banking app.
                optional: Can be switched on in the configuration.
        mcp:
            eyebrow: For AI assistants
            title: Also an MCP server
            text: Claude and other assistants can have letters explained through Clarifile. The letter itself never reaches the assistant, the answer contains placeholders only.
    upload:
        title: Understand official letters
        drop:
            title: Drop your letter here
            hint: PDF, photo or scan · up to 10 MB · not stored
            choose: Choose file
            chosen: Selected
            too_big: The file is larger than 10 MB.
            wrong_type: Please choose a PDF, PNG, JPEG or TIFF.
            one_file: Please one letter at a time.
            chip_ocr: Local text recognition
            chip_redacted: Personal data redacted
            chip_easy: Easy language
        label: Letter (PDF or photo)
        help: PDF, PNG, JPEG or TIFF, up to 10 MB.
        submit: Explain letter
        submitting: Explaining letter …
        progress: We are reading your letter, removing personal data and having it explained. This can take up to a minute. Please do not reload the page.
        easy_language: Explanation in Easy Read
        easy_language_help: Very short sentences, simple words, difficult words are explained.
        setup_missing: 'No language model set up yet: add %key% to app/.env.local or choose a local model with AI_PLATFORM=ollama (see README).'
    samples:
        title: No letter at hand?
        intro: Try it with an invented sample letter. Download it and upload it above. The scan has no text and is read by OCR.
        text: PDF
        scan: Scan
        letters:
            01-strafverfuegung: Penalty notice for speeding
            02-finanzamt-vorschreibung: Tax office notice of an income tax prepayment
            03-anonymverfuegung: Fine for illegal parking
    result:
        title: Explanation of your letter
        easy_language: In Easy Read
        deadline: Deadline
        no_deadline: The letter does not state a deadline.
        deadline_source: In the letter
        deadline_unverified: We could not find this deadline in the letter. Please check it in the original.
        invented_placeholders: The explanation contains placeholders that do not stand for anything in your letter (%placeholders%). These parts are unreliable, please check them in the original.
        invented_dates: The explanation mentions dates that are not in the letter (%dates%). They were probably calculated or guessed. Only what the original says counts.
        amount: Amount
        summary: What is it about?
        actions: What do you have to do?
        no_action: You do not have to do anything.
        payment:
            title: Pay with your banking app
            intro: Scan the code with your banking app, for example with "Pay with code" or "Scan QR code". The transfer is then filled in. You send it yourself.
            qr_label: QR code for the bank transfer
            payee: Payee
            amount: Amount
            amount_missing: Please enter it yourself, see the letter
            reference: Payment reference
            reference_missing: Not stated in the letter
            check: Compare payee, IBAN and amount in your banking app with the letter before you send the transfer.
        action_unclear: We could not tell for sure what you have to do. Check the letter for anything you have to pay, answer or hand in.
        questions: What you can ask
        legal_references: Legal provisions cited
        original_wording: Deadline, amount and legal provisions are quoted as written in the letter.
        disclaimer: This is an explanation, not legal advice. Always compare deadlines and amounts with the original.
        ocr_note: The text was read by text recognition and may contain reading errors.
        again: Upload another letter
