app:
    name: briefklar
    language_switch: Sprache
letter:
    privacy: Dein Brief wird nur für diese Anfrage verarbeitet und nicht gespeichert. Texterkennung läuft lokal auf diesem Server.
    upload:
        title: Brief verstehen
        intro: Lade einen Brief von einer Behörde hoch. Wir erklären dir in einfachen Worten, worum es geht und was du tun musst.
        label: Brief (PDF oder Foto)
        help: PDF, PNG, JPEG oder TIFF, höchstens 10 MB.
        submit: Brief erklären
        submitting: Brief wird erklärt …
        progress: Wir lesen deinen Brief, entfernen persönliche Daten und lassen ihn erklären. Das kann bis zu einer Minute dauern. Bitte lade die Seite nicht neu.
        easy_language: Erklärung in Leichter Sprache
        easy_language_help: Sehr kurze Sätze, einfache Wörter, schwierige Wörter werden erklärt.
    result:
        title: Erklärung deines Briefs
        easy_language: In Leichter Sprache
        deadline: Frist
        no_deadline: Im Brief steht keine Frist.
        deadline_unverified: Diese Frist haben wir so nicht im Brief gefunden. Bitte prüfe sie unbedingt im Original.
        invented_placeholders: Die Erklärung nennt Platzhalter, die nicht für Angaben aus deinem Brief stehen (%placeholders%). Diese Stellen sind unzuverlässig, bitte prüfe sie im Original.
        invented_dates: Die Erklärung nennt Daten, die so nicht im Brief stehen (%dates%). Sie wurden vermutlich berechnet oder geraten. Maßgeblich ist nur, was im Original steht.
        amount: Betrag
        summary: Worum geht es?
        actions: Was musst du tun?
        no_action: Du musst nichts tun.
        action_unclear: Wir konnten nicht sicher erkennen, was du tun musst. Lies im Brief nach, ob du etwas bezahlen, beantworten oder einreichen musst.
        questions: Was du nachfragen kannst
        legal_references: Genannte Rechtsgrundlagen
        original_wording: Frist, Betrag und Rechtsgrundlagen sind wörtlich aus dem Brief übernommen.
        disclaimer: Das ist eine Erklärung, keine Rechtsberatung. Fristen und Beträge immer mit dem Original vergleichen.
        ocr_note: Der Text wurde per Texterkennung gelesen und kann Lesefehler enthalten.
        again: Anderen Brief hochladen
