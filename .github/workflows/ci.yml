name: CI

on:
  push:
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [pii-shield]   # add ris-client once it has a composer.json
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit   # known vulnerabilities in dependencies
      - run: vendor/bin/phpunit
      - run: vendor/bin/php-cs-fixer check --diff
      - run: vendor/bin/phpstan analyse --no-progress

  pii-shield-mutation:
    # Mutation testing: do the tests notice when the code that protects data changes? (infection.json5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pii-shield
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/infection --threads=max --no-progress --show-mutations=0
      - name: Escaped mutants per file
        if: always()
        run: |
          echo '### Escaped mutants per file' >> "$GITHUB_STEP_SUMMARY"
          grep -oE '^[0-9]+\) [^:]+' var/infection/infection.log | sed -E 's/^[0-9]+\) //' | sort | uniq -c | sort -rn | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          grep -oE '^[0-9]+\) [^:]+' var/infection/infection.log | sed -E 's/^[0-9]+\) //' | sort | uniq -c | sort -rn || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infection-report
          path: packages/pii-shield/var/infection/

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # hashFiles() is not available in job-level `if`, so the app check runs as a step.
      - id: detect
        run: |
          if [ -f app/composer.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.detect.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - if: steps.detect.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu poppler-utils
      - if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: composer install --no-interaction --prefer-dist
      - if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: bin/phpunit
      - if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: vendor/bin/php-cs-fixer check --diff
      - if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: bin/console cache:warmup --env=test && vendor/bin/phpstan analyse --no-progress
      - if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: bin/console lint:container

  pii-shield-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the standalone service image
        run: docker build -t pii-shield packages/pii-shield
      - name: Smoke test
        run: |
          docker run -d --name pii -p 8080:8080 -e PII_SERVICE_TOKEN=ci-token pii-shield
          sleep 3
          curl -sf -H 'Content-Type: application/json' -H 'Authorization: Bearer ci-token' \
            -X POST localhost:8080/v1/redact -d '{"text":"SVNR 4568 150392"}' | grep -q 'SVNR_1'
