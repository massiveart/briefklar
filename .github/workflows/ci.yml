name: CI

on:
  push:
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [pii-shield]   # add ris-client once it has a composer.json
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit   # known vulnerabilities in dependencies
      - run: vendor/bin/phpunit
      - run: vendor/bin/php-cs-fixer check --diff
      - run: vendor/bin/phpstan analyse --no-progress

  pii-shield-mutation:
    # Mutation testing: do the tests notice when the code that protects data changes? (infection.json5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pii-shield
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/infection --threads=max --no-progress --show-mutations=0
      - name: Escaped mutants per file
        if: always()
        run: |
          echo '### Escaped mutants per file' >> "$GITHUB_STEP_SUMMARY"
          grep -oE '^[0-9]+\) [^:]+' var/infection/infection.log | sed -E 's/^[0-9]+\) //' | sort | uniq -c | sort -rn | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          grep -oE '^[0-9]+\) [^:]+' var/infection/infection.log | sed -E 's/^[0-9]+\) //' | sort | uniq -c | sort -rn || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infection-report
          path: packages/pii-shield/var/infection/

  app:
    # Runs in the app's Docker image (Tesseract, Poppler, PHP extensions), like `make test` and `make qa` locally.
    # The image layers come from the GitHub Actions cache, so a run only reaches the Debian mirrors
    # when the Dockerfile changes or the cache has expired.
    runs-on: ubuntu-latest
    env:
      RUN: docker run --rm -v ${{ github.workspace }}:/srv -w /srv/app briefklar-app:ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: briefklar-app:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - run: $RUN composer install --no-interaction --prefer-dist
      - run: $RUN bin/phpunit
      - run: $RUN vendor/bin/php-cs-fixer check --diff
      - run: $RUN sh -c 'bin/console cache:warmup --env=test && vendor/bin/phpstan analyse --no-progress'
      - run: $RUN bin/console lint:container

  pii-shield-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the standalone service image
        run: docker build -t pii-shield packages/pii-shield
      - name: Smoke test
        run: |
          docker run -d --name pii -p 8080:8080 -e PII_SERVICE_TOKEN=ci-token pii-shield
          sleep 3
          curl -sf -H 'Content-Type: application/json' -H 'Authorization: Bearer ci-token' \
            -X POST localhost:8080/v1/redact -d '{"text":"SVNR 4568 150392"}' | grep -q 'SVNR_1'
